name: AxoBoard release gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: axoboard_ci_password
          POSTGRES_DB: axoboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axoboard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:axoboard_ci_password@127.0.0.1:5432/axoboard_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact=100 --no-banner
      - name: Build production image
        run: docker build -t axoboard:ci .
